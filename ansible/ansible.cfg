[defaults]
inventory = inventory/hosts.yml
host_key_checking = True
retry_files_enabled = False
interpreter_python = auto_silent
# always prompt for the SSH password instead of trying key auth only
# (same as passing --ask-pass/-k to ansible-playbook every time)
ask_pass = True

[privilege_escalation]
become = False

[ssh_connection]
# Reuse one SSH connection for the whole run (the host runs crowdsec/sshd
# rate-limits - a burst of fresh connections gets the control host dropped).
pipelining = True
ssh_args = -C -o ControlMaster=auto -o ControlPersist=300s
