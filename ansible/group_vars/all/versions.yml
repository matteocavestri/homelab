---
# Image tag/digest per container, managed by scripts/check_updates.py.
#   mode: semver -> comparable tag (skopeo list-tags); tag_pattern is an optional override.
#   mode: digest -> rolling tag, tracked by digest in last_digest (skopeo inspect).
#   pin_digest   -> if set, the quadlet uses Image=<repo>@<pin_digest> instead of :<tag>.
# Local images (localhost/*, e.g. comfyui-p4) are not tracked here.
versions:
  alertmanager:
    image: docker.io/prom/alertmanager
    tag: "v0.34.0"
    mode: semver
  alloy:
    image: docker.io/grafana/alloy
    tag: "v1.19.0"
    mode: semver
  authentik:
    image: ghcr.io/goauthentik/server
    tag: "2026.8.0"
    mode: semver
    # This image publishes a doubly-nested manifest list; Podman/skopeo can't resolve
    # it by tag alone (fails with "Unexpectedly received a manifest list instead of a
    # manifest"). Pull by digest instead. tag is kept for readable tracking only -
    # check_updates.py still bumps it, but the running container stays on pin_digest
    # until this is updated/removed by hand.
    pin_digest: "sha256:5217eed4e86a3c6666ecf81c3430753ef958f97f93ac614070d458c10e0b2b33"
  authentik_postgres:
    image: docker.io/library/postgres
    tag: "17-alpine"
    mode: digest  # rolling tag (latest 17.x patch), not a fixed version
    last_digest: "sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73"
