---
ai_slice:
  memory_max: "24G"
  memory_swap_max: "16G"
  cpu_quota: "2800%"
  allowed_cpus: "0-13,28-41"

openwebui:
  oauth_provider_name: "authentik"
  openid_provider_url: "https://auth.cavestrihome.com/application/o/openwebui/.well-known/openid-configuration"
  openid_redirect_uri: "https://llm.cavestrihome.com/oauth/oidc/callback"
  webui_url: "https://llm.cavestrihome.com"
  enable_oauth_signup: "true"
  enable_login_form: "false"
  oauth_merge_accounts_by_email: "true"
  cors_allow_origin: "https://llm.cavestrihome.com"
  enable_otel: "true"
  enable_otel_traces: "true"
  enable_otel_metrics: "true"
  otel_exporter_otlp_insecure: "true"
  otel_exporter_otlp_endpoint: "alloy.dns.podman:14317"
  otel_service_name: "open-webui"
  enable_rag_local_web_fetch: "true"
  enable_kb_exec: "true"
  ollama_base_url: "http://ollama:11434"

comfyui:
  cli_args: "--lowvram"

crawl4ai:
  api_usage: "true"
  max_concurrent_tasks: "2"

n8n:
  runners_mode: "internal"
  webhook_url: "https://n8n.cavestrihome.com"

ollama:
  host: "0.0.0.0"
  keep_alive: "5m"
  flash_attention: "1"
  kv_cache_type: "q4_0"
  nvidia_visible_devices: "all"
  nvidia_driver_capabilities: "compute,utility"

openai_edge_tts:
  port: "5050"
  default_voice: "it-IT-ElsaNeural"
  default_language: "it-IT"
  default_response_format: "mp3"
  default_speed: "1.0"
  require_api_key: "True"
  remove_filter: "False"
  expand_api: "True"

pipelines:
  urls: ""

searxng:
  base_url: "https://web.cavestrihome.com/"

tika:
  java_tool_options: "-Xmx4g"
