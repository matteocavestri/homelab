---
- name: Ensure destination directories exist (auth)
  ansible.builtin.file:
    path: "{{ (item.dest | dirname) }}"
    state: directory
    mode: "0755"
  loop: "{{ auth_files }}"
  loop_control:
    label: "{{ item.dest }}"

- name: Deploy templated quadlet/config files (auth)
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "{{ item.mode }}"
  loop: "{{ auth_files }}"
  loop_control:
    label: "{{ item.dest }}"
  notify: "{{ item.notify + ['daemon-reload'] }}"
