---
# daemon-reload is defined once, in roles/common/handlers/main.yml. See there.
#
# arr.slice/arr.target/backup-arr.timer are independent of container start order,
# so they sit above the container-ordering note below.
- name: "restart arr.slice"
  listen: "restart arr.slice"
  ansible.builtin.systemd_service:
    name: "arr.slice"
    state: restarted
    scope: user
  failed_when: false

- name: "restart arr.target"
  listen: "restart arr.target"
  ansible.builtin.systemd_service:
    name: "arr.target"
    state: restarted
    scope: user
  failed_when: false

- name: "restart backup-arr.timer"
  listen: "restart backup-arr.timer"
  ansible.builtin.systemd_service:
    name: "backup-arr.timer"
    state: restarted
    scope: user
  failed_when: false
#
# gluetun must stay the first handler below: containers on Network=container:gluetun
# (flaresolverr, lidarr, nzbget, prowlarr, qbittorrent, radarr, sonarr, sportarr) lose
# networking if restarted before gluetun is recreated. Handlers run in listed order.
- name: "restart gluetun.service"
  listen: "restart gluetun.service"
  ansible.builtin.systemd_service:
    name: "gluetun.service"
    state: restarted
    scope: user
  failed_when: false

