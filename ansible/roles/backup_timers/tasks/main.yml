---
# Runs last, after every role has deployed its own backup-*.timer file, so this
# is self-healing: a timer disabled/stopped by hand goes back to enabled+started
# on the next deploy.
- name: Enable and start backup timers
  ansible.builtin.systemd_service:
    name: "{{ item }}.timer"
    scope: user
    enabled: true
    state: started
  loop: "{{ backup_timer_units }}"
  loop_control:
    label: "{{ item }}.timer"
