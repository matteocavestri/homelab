---
# daemon-reload is defined once, in roles/common/handlers/main.yml. See there.

- name: "restart monitoring.slice"
  listen: "restart monitoring.slice"
  ansible.builtin.systemd_service:
    name: "monitoring.slice"
    state: restarted
    scope: user
  failed_when: false

