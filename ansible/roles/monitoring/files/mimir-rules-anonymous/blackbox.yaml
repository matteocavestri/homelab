groups:

  # ─── Blackbox HTTP/TLS Probes ────────────────────────────────────

  - name: Blackbox

    rules:

      # Endpoint is unreachable or returning non-2xx
      - alert: ProbeDown
        expr: 'probe_success{job="blackbox"} == 0'
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Endpoint down ({{ $labels.name }})
          description: "Probe for {{ $labels.name }} ({{ $labels.target }}) has been failing for 2 minutes.\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

      # Endpoint is slow to respond (>3s, timeout is 10s)
      - alert: ProbeSlowResponse
        expr: 'probe_duration_seconds{job="blackbox"} > 3'
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Endpoint slow ({{ $labels.name }})
          description: "Probe for {{ $labels.name }} is taking more than 3 seconds to respond.\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

      # TLS certificate expires in less than 14 days
      - alert: TLSCertExpiringWarning
        expr: '(probe_ssl_earliest_cert_expiry{job="blackbox"} - time()) / 86400 < 14'
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: TLS certificate expiring soon ({{ $labels.name }})
          description: "TLS certificate for {{ $labels.name }} expires in less than 14 days.\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

      # TLS certificate expires in less than 3 days
      - alert: TLSCertExpiringSoon
        expr: '(probe_ssl_earliest_cert_expiry{job="blackbox"} - time()) / 86400 < 3'
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: TLS certificate expiring in 3 days ({{ $labels.name }})
          description: "TLS certificate for {{ $labels.name }} expires in less than 3 days. Renew immediately.\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

      # TLS certificate is invalid or already expired
      - alert: TLSCertInvalid
        expr: 'probe_http_ssl{job="blackbox"} == 0 and probe_success{job="blackbox"} == 1'
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: TLS certificate invalid ({{ $labels.name }})
          description: "The TLS certificate for {{ $labels.name }} is invalid or expired. The probe succeeded via HTTP but SSL validation failed.\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

      # HTTP status code is not 2xx (probe succeeded at TCP level but got error response)
      - alert: ProbeHttpStatusNot2xx
        expr: 'probe_http_status_code{job="blackbox"} != 0 and (probe_http_status_code{job="blackbox"} < 200 or probe_http_status_code{job="blackbox"} >= 300)'
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Endpoint returning non-2xx ({{ $labels.name }})
          description: "{{ $labels.name }} is returning HTTP {{ $value }}. Expected a 2xx response.\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"


