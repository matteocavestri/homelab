---
# Read-only: never touches unit state. Run with `ansible-playbook site.yml --tags status`.

- name: Check enabled state of targets
  ansible.builtin.command: "systemctl --user is-enabled {{ item }}.target"
  register: status_targets_enabled
  changed_when: false
  failed_when: false
  loop: "{{ status_targets }}"
  loop_control:
    label: "{{ item }}.target"

- name: Check active state of targets
  ansible.builtin.command: "systemctl --user is-active {{ item }}.target"
  register: status_targets_active
  changed_when: false
  failed_when: false
  loop: "{{ status_targets }}"
  loop_control:
    label: "{{ item }}.target"

- name: Check enabled state of timers
  ansible.builtin.command: "systemctl --user is-enabled {{ item }}.timer"
  register: status_timers_enabled
  changed_when: false
  failed_when: false
  loop: "{{ status_timers }}"
  loop_control:
    label: "{{ item }}.timer"

- name: Check active state of timers
  ansible.builtin.command: "systemctl --user is-active {{ item }}.timer"
  register: status_timers_active
  changed_when: false
  failed_when: false
  loop: "{{ status_timers }}"
  loop_control:
    label: "{{ item }}.timer"

- name: List failed user units
  ansible.builtin.command: "systemctl --user --state=failed --no-legend list-units"
  register: status_failed_units
  changed_when: false
  failed_when: false

- name: Build report
  ansible.builtin.set_fact:
    status_report: |-
      == targets ==
      {%- for i in range(status_targets | length) %}
      {{ (status_targets[i] ~ '.target').ljust(24) }} enabled={{ (status_targets_enabled.results[i].stdout | default('?')).ljust(16) }} active={{ status_targets_active.results[i].stdout | default('?') }}
      {%- endfor %}
      == timers ==
      {%- for i in range(status_timers | length) %}
      {{ (status_timers[i] ~ '.timer').ljust(24) }} enabled={{ (status_timers_enabled.results[i].stdout | default('?')).ljust(16) }} active={{ status_timers_active.results[i].stdout | default('?') }}
      {%- endfor %}
      == failed units ==
      {{ status_failed_units.stdout if status_failed_units.stdout | length > 0 else '(none)' }}

- name: Show report
  ansible.builtin.debug:
    msg: "{{ status_report.split('\n') }}"

- name: Compute problem list
  ansible.builtin.set_fact:
    status_problems: >-
      {%- set problems = [] -%}
      {%- for i in range(status_timers | length) -%}
        {%- set en = status_timers_enabled.results[i].stdout | default('') -%}
        {%- set ac = status_timers_active.results[i].stdout | default('') -%}
        {%- if en not in status_ok_enabled_states or ac != 'active' -%}
          {%- set _ = problems.append(status_timers[i] ~ '.timer (enabled=' ~ en ~ ', active=' ~ ac ~ ')') -%}
        {%- endif -%}
      {%- endfor -%}
      {%- if status_failed_units.stdout | length > 0 -%}
        {%- set _ = problems.append('failed unit(s): ' ~ (status_failed_units.stdout_lines | join(', '))) -%}
      {%- endif -%}
      {{ problems | join('; ') }}

- name: Fail if problems were found
  ansible.builtin.fail:
    msg: "Problems found: {{ status_problems }}"
  when: status_problems | length > 0
