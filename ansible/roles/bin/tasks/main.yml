---
- name: Ensure destination directories exist (bin)
  ansible.builtin.file:
    path: "{{ (item.dest | dirname) }}"
    state: directory
    mode: "0755"
  loop: "{{ bin_files }}"
  loop_control:
    label: "{{ item.dest }}"

- name: Install local binaries (bin)
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "{{ item.mode }}"
  loop: "{{ bin_files }}"
  loop_control:
    label: "{{ item.dest }}"
