---
# Tier: high (core network path - keep alive under pressure)
netcore_slice:
  cpu_weight: "500"
  startup_cpu_weight: "900"
  cpu_quota: "200%"
  memory_min: "128M"
  memory_low: "256M"
  memory_high: "640M"
  memory_max: "1G"
  memory_swap_max: "256M"   # small: cold-page eviction only, DNS latency-sensitive

ddns_updater:
  period: "5m"
  update_cooldown_period: "5m"
  publicip_fetchers: "all"
  publicip_http_providers: "all"
  publicipv4_http_providers: "all"
  publicip_dns_providers: "all"
  publicip_dns_timeout: "3s"
  http_timeout: "10s"
  listening_address: "127.0.0.1:8000"
  log_level: "info"
  log_caller: "hidden"
  backup_period: "72h"
  backup_directory: "/updater/data"

pihole:
  dns_upstreams: "9.9.9.9;1.1.1.1"
  dns_listening_mode: "all"
  webserver_port: "3080"
  dns_dnssec: "true"
  dns_rev_servers: "true,192.168.1.0/24,192.168.1.1,lan"
