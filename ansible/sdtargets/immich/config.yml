---
# Tier: medium
immich_slice:
  cpu_weight: "150"
  startup_cpu_weight: "300"
  cpu_quota: "800%"
  memory_min: "256M"
  memory_low: "512M"
  memory_high: "6G"
  memory_max: "8G"
  memory_swap_max: "4G"   # ML model + background jobs, very swap-tolerant

immich_postgres:
  user: "immich"
  db: "immich"

immich:
  db_hostname: "immich-postgres"
  db_username: "immich"
  db_database_name: "immich"
  redis_hostname: "immich-redis"
  gomaxprocs: "4"
  omp_num_threads: "4"
  nvidia_visible_devices: "all"
  nvidia_driver_capabilities: "compute,video,utility"
