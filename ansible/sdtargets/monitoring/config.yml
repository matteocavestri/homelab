---
# Tier: high (observability - must survive to diagnose incidents)
monitoring_slice:
  cpu_weight: "500"
  startup_cpu_weight: "900"
  cpu_quota: "800%"
  memory_min: "512M"
  memory_low: "1G"
  memory_high: "6G"
  memory_max: "8G"
  memory_swap_max: "2G"   # TSDB cold index pages swap well; keep responsive during incidents

grafana:
  server_root_url: "https://monitoring.fmpt.company"
  auth_anonymous_enabled: "false"
  admin_user: "admin"
  users_allow_sign_up: "false"
  feature_toggles_enable: "traceqlEditor metricsSummary"
  oauth_enabled: "true"
  oauth_name: "authentik"
  oauth_scopes: "openid profile email"
  oauth_auth_url: "https://auth.fmpt.company/application/o/authorize/"
  oauth_token_url: "https://auth.fmpt.company/application/o/token/"
  oauth_api_url: "https://auth.fmpt.company/application/o/userinfo/"
  auth_signout_redirect_url: "https://auth.fmpt.company/application/o/grafana/end-session/"
  oauth_auto_login: "true"
  oauth_role_attribute_path: "contains(groups[*], 'Grafana Admins') && 'Admin' || contains(groups[*], 'Grafana Editors') && 'Editor' || 'Viewer' || is_superuser && 'Admin'"

ntfy:
  url: "https://ntfy.fmpt.company"
  topic: "systemd-critical"
  user: "systemd"

nvidia_gpu_exporter:
  nvidia_visible_devices: "all"
  nvidia_driver_capabilities: "utility"

podman_exporter:
  container_host: "unix:///run/user/1000/podman/podman.sock"
