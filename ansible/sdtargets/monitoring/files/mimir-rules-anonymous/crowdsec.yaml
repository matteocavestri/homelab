groups:

  # ─── CrowdSec Security ───────────────────────────────────────────

  - name: CrowdSec

    rules:

      # CrowdSec process is not responding to LAPI calls
      - alert: CrowdSecDown
        expr: 'up{job="crowdsec"} == 0'
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: CrowdSec is down (instance {{ $labels.instance }})
          description: "CrowdSec has not responded for 2 minutes.\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

      # Spike in local alerts (exploits, backdoors, etc.)
      - alert: CrowdSecHighAlertRate
        expr: 'increase(cs_alerts[10m]) > 5'
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: CrowdSec alert spike ({{ $labels.reason }})
          description: "More than 5 new alerts in 10 minutes for {{ $labels.reason }}.\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

      # Abnormal bucket overflow → many IPs hitting the same rules
      - alert: CrowdSecBucketOverflowSpike
        expr: 'increase(cs_bucket_overflowed_total[5m]) > 10'
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: CrowdSec bucket overflow spike ({{ $labels.name }})
          description: "More than 10 overflows in 5 minutes for rule {{ $labels.name }}.\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

      # LAPI is not receiving decisions from CAPI (cloud sync broken)
      - alert: CrowdSecCapiSyncStale
        expr: 'increase(cs_lapi_machine_requests_total{route="/v1/heartbeat"}[30m]) == 0'
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: CrowdSec CAPI heartbeat stopped
          description: "No LAPI heartbeat in the last 30 minutes. Check CAPI connectivity.\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

      # Log source rate too low (source is silent or log rotation issue)
      - alert: CrowdSecLogSourceSilent
        expr: 'rate(cs_filesource_hits_total{acquis_type="npmplus",source=~".*access.log"}[10m]) == 0'
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: CrowdSec log source silent ({{ $labels.source }})
          description: "No lines read from {{ $labels.source }} for 10 minutes. NPM Plus may be down.\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

      # High parse failure rate on access.log (log format change or parser bug)
      - alert: CrowdSecHighParseFailureRate
        expr: 'rate(cs_parser_hits_ko_total{source=~".*access.log"}[5m]) / rate(cs_parser_hits_total{source=~".*access.log"}[5m]) > 0.10'
        for: 5m
        labels:
          severity: info
        annotations:
          summary: CrowdSec parse failure rate high ({{ $labels.source }})
          description: "More than 10% of lines from {{ $labels.source }} are failing to parse.\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"


