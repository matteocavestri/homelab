# Deploy metadata for this sdtarget. Quadlet/systemd unit files in templates/
# are deployed by convention (see tasks/deploy_target.yml); env & other config
# files are listed explicitly here with their dest, mode and which units to
# restart when they change.
---
config_files:
  - src: "homarr.env.j2"
    dest: "~/.config/homarr/homarr.env"
    mode: "0600"
    restart: ["homarr.service"]
  - src: "homepage.env.j2"
    dest: "~/.config/homepage/homepage.env"
    mode: "0600"
    restart: ["homepage.service"]
