---
# Tier: medium
office_slice:
  cpu_weight: "150"
  startup_cpu_weight: "300"
  cpu_quota: "400%"
  memory_min: "128M"
  memory_low: "256M"
  memory_high: "1536M"
  memory_max: "2G"
  memory_swap_max: "1G"   # low-traffic apps, tolerant of swap

freshrss:
  oidc_enabled: "1"
  oidc_provider_metadata_url: "https://auth.cavestrihome.com/application/o/freshrss/.well-known/openid-configuration"
  oidc_client_id: "S38qP4AALdIxr8n2FZyCcMABTafZyLA9E7Ed2A2O"
  oidc_x_forwarded_headers: "X-Forwarded-Port X-Forwarded-Proto X-Forwarded-Host"
  oidc_remote_user_claim: "preferred_username"
  oidc_scopes: "openid email profile"

vaultwarden:
  rocket_port: "8080"
  domain: "https://pass.cavestrihome.com"
  signups_allowed: "false"
