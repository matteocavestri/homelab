---
# Single play so handlers (daemon-reload, restart <svc>) are shared across all roles.
# become: false everywhere - Quadlets are systemd --user units, owned and managed by
# the rootless user itself (ansible_user in the inventory), never by root.
- name: Deploy homelab (Podman Quadlet via Ansible)
  hosts: all
  become: false
  gather_facts: true

  roles:
    - role: bin
      tags: [bin]
    - role: common
      tags: [common]
    - role: netcore
      tags: [netcore]
    - role: proxy
      tags: [proxy]
    - role: auth
      tags: [auth]
    - role: monitoring
      tags: [monitoring]
    - role: ai
      tags: [ai]
    - role: media_arr
      tags: [media_arr, arr]
    - role: media_immich
      tags: [media_immich, immich]
    - role: media_jellyfin
      tags: [media_jellyfin, jellyfin]
    - role: office
      tags: [office]
    - role: backup_timers
      tags: [backup_timers]
    - role: status
      tags: [status, never]
