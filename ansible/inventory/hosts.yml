---
# One physical host, member of every "target" group: each group auto-loads
# group_vars/<group-name>.yml (.slice limits + non-sensitive role config), while
# group_vars/all/ (versions.yml, common.yml, vault.yml) applies to all of them.
# ansible_user must be the rootless user that owns the Quadlets (systemctl --user),
# never root - tasks run with become: false.
all:
  children:
    ai:
      hosts:
        homelab:
    auth:
      hosts:
        homelab:
    media_arr:
      hosts:
        homelab:
    media_immich:
      hosts:
        homelab:
    media_jellyfin:
      hosts:
        homelab:
    monitoring:
      hosts:
        homelab:
    netcore:
      hosts:
        homelab:
    office:
      hosts:
        homelab:
    proxy:
      hosts:
        homelab:
    common:
      hosts:
        homelab:
  hosts:
    homelab:
      ansible_host: "192.168.1.250"
      ansible_user: "admin"
      ansible_python_interpreter: "/usr/bin/python3"
