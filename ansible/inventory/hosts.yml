---
# One physical host. group_vars/all/ (versions.yml, common.yml, vault.yml)
# applies to it; per-sdtarget config lives in sdtargets/<name>/config.yml and is
# loaded by tasks/deploy_target.yml, not via group_vars.
# ansible_user must be the rootless user that owns the Quadlets (systemctl --user),
# never root - tasks run with become: false.
all:
  hosts:
    homelab:
      ansible_host: "192.168.1.250"
      ansible_user: "admin"
      ansible_python_interpreter: "/usr/bin/python3"
